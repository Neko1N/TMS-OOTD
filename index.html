<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMS OOTD 穿搭工坊 v2.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        /* 基礎介面樣式 */
        body { margin: 0; padding: 0; font-family: "Microsoft JhengHei", sans-serif; background-color: #f0f2f5; display: flex; height: 100vh; overflow: hidden; transition: background-color 0.3s; }
        .sidebar { width: 330px; background: white; padding: 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 15px; overflow-y: auto; transition: background-color 0.3s, color 0.3s; z-index: 10; }
        .canvas-area { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; overflow: auto; transition: background-color 0.3s; }
        .canvas-container { box-shadow: 0 0 20px rgba(0,0,0,0.2); }
        
        .header-box { display: flex; justify-content: space-between; align-items: center; }
        h2 { font-size: 20px; color: #2c3e50; margin: 0; transition: color 0.3s; font-family: "Microsoft JhengHei"; }
        .btn-theme { background: #95a5a6; color: white; padding: 6px 12px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-family: "Microsoft JhengHei"; transition: 0.3s; }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-family: "Microsoft JhengHei"; font-size: 14px; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: "Microsoft JhengHei"; }
        button { padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: "Microsoft JhengHei"; transition: 0.3s; }
        .btn-main { background: #2c3e50; color: white; }
        .btn-upload { background: #27ae60; color: white; }
        .btn-share { background: #e1306c; color: white; margin-top: auto; }

        /* 深色模式切換 */
        body.dark-mode { background-color: #1e1e1e; }
        body.dark-mode .sidebar { background-color: #252526; color: #cccccc; }
        body.dark-mode h2 { color: #ffffff; }
        body.dark-mode input, body.dark-mode select { background-color: #333333; color: #ffffff; border: 1px solid #555555; }
        
        /* 圖層與顏色按鈕微調 */
        .layer-btn-group { display: flex; gap: 5px; }
        .layer-btn-group button { flex: 1; padding: 8px; font-size: 12px; background: #bdc3c7; color: #2c3e50; }
        .layer-btn-group button:hover { background: #95a5a6; color: white; }
        body.dark-mode .layer-btn-group button { background: #555; color: #ddd; }
        body.dark-mode .layer-btn-group button:hover { background: #777; }
        input[type="color"] { padding: 2px; height: 35px; cursor: pointer; width: 100%; }
        
        /* 單選按鈕區塊 */
        .radio-group { display: flex; gap: 10px; font-size: 14px; font-family: "Microsoft JhengHei"; align-items: center; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="sidebar">
    <div class="header-box">
        <h2>穿搭預覽工坊</h2>
        <button class="btn-theme" onclick="toggleTheme()">切換深色 🌙</button>
    </div>
    <div class="input-group">
        <label>角色 ID：</label>
        <input type="text" id="charName" placeholder="輸入角色名稱">
    </div>
    <div class="input-group">
        <label>時裝預設：</label>
        <select id="preset">
            <option value="base">目前裝備</option>
            <option value="1">預設1</option>
            <option value="2">預設2</option>
            <option value="3">預設3</option>
        </select>
    </div>
    
    <div class="input-group">
        <label>文字移動模式：</label>
        <div class="radio-group">
            <label><input type="radio" name="textMode" value="block" checked onchange="rebuildTextMode()"> 整塊移動</label>
            <label><input type="radio" name="textMode" value="line" onchange="rebuildTextMode()"> 單獨移動</label>
        </div>
    </div>

    <button class="btn-main" onclick="fetchCharacterData()">開始渲染</button>
    <div id="status" style="font-size:12px; color:#e74c3c; height:15px;"></div>
    <hr>
    
    <div class="input-group">
        <label>畫布底色：</label>
        <input type="color" id="bgColor" value="#ffffff" onchange="changeBgColor()">
    </div>

    <div class="input-group" style="margin-top: 5px;">
        <label>自訂背景/素材 (支援 Ctrl+V 貼上)：</label>
        <input type="file" id="fileUpload" style="display:none" onchange="handleUpload(event)">
        <button class="btn-upload" onclick="document.getElementById('fileUpload').click()">上傳圖片</button>
    </div>
    
    <div class="input-group">
        <label>物件圖層與復原控制：</label>
        <div class="layer-btn-group">
            <button onclick="moveLayer('up')">上移</button>
            <button onclick="moveLayer('down')">下移</button>
            <button onclick="undo()" style="background:#3498db; color:white;">復原(Z)</button>
            <button onclick="redo()" style="background:#2980b9; color:white;">重做(Y)</button>
        </div>
    </div>

    <hr>
    <div id="controls" style="display:none">
        <label style="font-weight:bold">畫布顯示設定：</label>
        <label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="showBasic" checked onchange="updateVisibility()"> 角色基本資訊</label>
        <label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="showBeauty" checked onchange="updateVisibility()"> 美容詳細資訊</label>
        <label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="showCash" checked onchange="updateVisibility()"> 時裝與染色清單</label>
    </div>
    <button class="btn-share" onclick="shareToIG()">發布/投稿至 IG</button>
</div>

<div class="canvas-area">
    <canvas id="ootdCanvas"></canvas>
</div>

<script>
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('ootd_theme', isDark ? 'dark' : 'light');
    }

    window.onload = () => {
        if (localStorage.getItem('ootd_theme') === 'dark') document.body.classList.add('dark-mode');
    };

    const API_KEY = "live_55e086f21dba194971d8ef967454551eb56c93c1f21e04db8572424fed53d2e1efe8d04e6d233bd35cf2fabdeb93fb0d";
    const PROXY = "https://corsproxy.io/?"; 
    
    const canvas = new fabric.Canvas('ootdCanvas', {
        width: 1080, height: 1080, backgroundColor: '#ffffff', preserveObjectStacking: true
    });

    canvas.clipPath = new fabric.Rect({ width: 1080, height: 1080, top: 0, left: 0, absolutePositioned: true });

    let currentRenderData = null;

    // --- 復原 / 重做系統 (Undo / Redo) ---
    let historyState = [];
    let historyIndex = -1;
    let isHistoryModifying = false;

    function saveHistory() {
        if (isHistoryModifying) return;
        const json = canvas.toJSON(['groupType', 'hasControls', 'lockScalingX', 'lockScalingY', 'selectable']);
        historyState = historyState.slice(0, historyIndex + 1);
        historyState.push(json);
        historyIndex++;
    }

    canvas.on('object:modified', saveHistory);
    canvas.on('object:added', (e) => { if (!isHistoryModifying) saveHistory(); });
    canvas.on('object:removed', (e) => { if (!isHistoryModifying) saveHistory(); });

    function undo() {
        if (historyIndex > 0) {
            isHistoryModifying = true;
            historyIndex--;
            canvas.loadFromJSON(historyState[historyIndex], function() {
                canvas.renderAll();
                isHistoryModifying = false;
                updateVisibility();
            });
        }
    }

    function redo() {
        if (historyIndex < historyState.length - 1) {
            isHistoryModifying = true;
            historyIndex++;
            canvas.loadFromJSON(historyState[historyIndex], function() {
                canvas.renderAll();
                isHistoryModifying = false;
                updateVisibility();
            });
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
        if (e.ctrlKey && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
    });

    // --- 背景顏色變更 ---
    function changeBgColor() {
        canvas.backgroundColor = document.getElementById('bgColor').value;
        canvas.renderAll();
        saveHistory();
    }

    // --- 圖層控制 ---
    function moveLayer(dir) {
        const obj = canvas.getActiveObject();
        if (!obj) return alert("請先在畫布上點選要移動的圖片或文字！");
        if (dir === 'up') canvas.bringForward(obj);
        if (dir === 'down') canvas.sendBackwards(obj);
        canvas.renderAll();
        saveHistory();
    }

    // --- 剪貼簿貼上 (Ctrl+V) 支援 ---
    window.addEventListener('paste', function(e) {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let index in items) {
            const item = items[index];
            if (item.kind === 'file') {
                const blob = item.getAsFile();
                const reader = new FileReader();
                reader.onload = function(event) {
                    fabric.Image.fromURL(event.target.result, function(img) {
                        img.set({ left: 540, top: 540, originX: 'center', originY: 'center' });
                        if (img.width > 800) img.scaleToWidth(800);
                        canvas.add(img);
                        canvas.setActiveObject(img); 
                    });
                };
                reader.readAsDataURL(blob);
            }
        }
    });

    async function fetchCharacterData() {
        const name = document.getElementById('charName').value.trim();
        if (!name) return;
        document.getElementById('status').innerText = "資料讀取中...";
        try {
            const idRes = await fetch(`${PROXY}${encodeURIComponent('https://open.api.nexon.com/maplestorytw/v1/id?character_name=' + name)}`, { headers: {"x-nxopen-api-key": API_KEY} });
            const idData = await idRes.json();
            const baseUrl = "https://open.api.nexon.com/maplestorytw/v1/character/";
            const [basic, beauty, cash] = await Promise.all([
                fetch(`${PROXY}${encodeURIComponent(baseUrl + 'basic?ocid=' + idData.ocid)}`, { headers: {"x-nxopen-api-key": API_KEY} }).then(r => r.json()),
                fetch(`${PROXY}${encodeURIComponent(baseUrl + 'beauty-equipment?ocid=' + idData.ocid)}`, { headers: {"x-nxopen-api-key": API_KEY} }).then(r => r.json()),
                fetch(`${PROXY}${encodeURIComponent(baseUrl + 'cashitem-equipment?ocid=' + idData.ocid)}`, { headers: {"x-nxopen-api-key": API_KEY} }).then(r => r.json())
            ]);
            
            currentRenderData = { name, basic, beauty, cash };
            
            const objects = canvas.getObjects();
            objects.forEach(obj => { if (obj.groupType) canvas.remove(obj); });
            
            historyState = []; historyIndex = -1; 
            renderToCanvas();
            
            document.getElementById('controls').style.display = 'block';
            document.getElementById('status').innerText = "";
            setTimeout(saveHistory, 100);
        } catch (e) {
            document.getElementById('status').innerText = "錯誤：" + e.message;
        }
    }

    function rebuildTextMode() {
        if (!currentRenderData) return;
        const objects = canvas.getObjects();
        objects.forEach(obj => { if (obj.groupType && obj.groupType !== 'char') canvas.remove(obj); });
        
        objects.forEach(obj => { if (obj.groupType === 'char') canvas.remove(obj); });
        
        renderToCanvas();
        saveHistory();
    }

    function renderToCanvas() {
        if (!currentRenderData) return;
        const { name, basic, beauty, cash } = currentRenderData;
        const preset = document.getElementById('preset').value;
        const mode = document.querySelector('input[name="textMode"]:checked').value;

        fabric.Image.fromURL(PROXY + encodeURIComponent(basic.character_image), function(img) {
            img.set({ left: 100, top: 400, selectable: true, hasControls: false, groupType: 'char' }); 
            img.scale(3.5);
            canvas.add(img);
        }, { crossOrigin: 'anonymous' });

        let basicObjs = [];
        basicObjs.push(new fabric.Text(`${name}`, { left: 0, top: 0, fontSize: 36, fontFamily: "Microsoft JhengHei", fontWeight: 'bold' }));
        basicObjs.push(new fabric.Text(`伺服器：${basic.world_name} | 職業：${basic.character_class}`, { left: 0, top: 50, fontSize: 22, fontFamily: "Microsoft JhengHei" }));

        const hair = beauty.character_hair;
        const face = beauty.character_face;
        const skin = beauty.character_skin_name || "一般";
        let h_color = hair.base_color + (hair.mix_color ? ` ${100-hair.mix_rate} + ${hair.mix_color} ${hair.mix_rate}` : "");
        let f_color = face.base_color + (face.mix_color ? ` ${100-face.mix_rate} + ${face.mix_color} ${face.mix_rate}` : "");

        let skin_text = skin;
        const adv_skin = beauty.character_skin;
        if (adv_skin && typeof adv_skin === 'object') {
            const real_skin_name = adv_skin.skin_name || skin;
            let extras = [];
            if (adv_skin.hue !== undefined) extras.push(`亮度${adv_skin.hue}`);
            if (adv_skin.saturation !== undefined) extras.push(`色調${adv_skin.saturation}`);
            for (let k in adv_skin) {
                if (!['skin_name', 'color_style', 'hue', 'saturation'].includes(k) && typeof adv_skin[k] === 'number') {
                    extras.push(`飽和度${adv_skin[k]}`);
                    break;
                }
            }
            skin_text = extras.length > 0 ? `${real_skin_name} (${extras.join(" / ")})` : real_skin_name;
        }

        let beautyObjs = [];
        let by = 0;
        beautyObjs.push(new fabric.Text(`【 美容詳細資訊 】`, { left: 0, top: by, fontSize: 22, fontFamily: "Microsoft JhengHei", fontWeight: 'bold' })); by += 35;
        beautyObjs.push(new fabric.Text(`髮型：${hair.hair_name} | 顏色：${h_color}`, { left: 0, top: by, fontSize: 20, fontFamily: "Microsoft JhengHei" })); by += 30;
        beautyObjs.push(new fabric.Text(`臉型：${face.face_name} | 顏色：${f_color}`, { left: 0, top: by, fontSize: 20, fontFamily: "Microsoft JhengHei" })); by += 30;
        beautyObjs.push(new fabric.Text(`膚色：${skin_text}`, { left: 0, top: by, fontSize: 20, fontFamily: "Microsoft JhengHei" }));

        const items = (preset === 'base') ? cash.cash_item_equipment_base : cash[`cash_item_equipment_preset_${preset}`];
        let cashObjs = [];
        let cy = 0;
        cashObjs.push(new fabric.Text(`【 時裝穿搭與染色 】`, { left: 0, top: cy, fontSize: 22, fontFamily: "Microsoft JhengHei", fontWeight: 'bold' })); cy += 35;
        items.forEach(item => {
            const prism = item.cash_item_coloring_prism;
            let dye = prism ? ` (色相${prism.hue} / 色調${prism.saturation} / 飽和度${prism.value})` : (item.cash_item_color ? ` (染色：${item.cash_item_color})` : "");
            cashObjs.push(new fabric.Text(`• [${item.cash_item_equipment_part}] ${item.cash_item_name}${dye}`, { left: 0, top: cy, fontSize: 18, fontFamily: "Microsoft JhengHei" }));
            cy += 28;
        });

        if (mode === 'block') {
            let bGroup = new fabric.Group(basicObjs, { left: 50, top: 50, groupType: 'basic' });
            let beGroup = new fabric.Group(beautyObjs, { left: 50, top: 160, groupType: 'beauty' });
            let cGroup = new fabric.Group(cashObjs, { left: 550, top: 50, groupType: 'cash' });
            canvas.add(bGroup, beGroup, cGroup);
        } else {
            basicObjs.forEach(obj => { obj.set({ left: obj.left + 50, top: obj.top + 50, groupType: 'basic' }); canvas.add(obj); });
            beautyObjs.forEach(obj => { obj.set({ left: obj.left + 50, top: obj.top + 160, groupType: 'beauty' }); canvas.add(obj); });
            cashObjs.forEach(obj => { obj.set({ left: obj.left + 550, top: obj.top + 50, groupType: 'cash' }); canvas.add(obj); });
        }
        
        updateVisibility();
    }

    function updateVisibility() {
        const showBasic = document.getElementById('showBasic').checked;
        const showBeauty = document.getElementById('showBeauty').checked;
        const showCash = document.getElementById('showCash').checked;
        
        canvas.getObjects().forEach(obj => {
            if (obj.groupType === 'basic') obj.set('visible', showBasic);
            if (obj.groupType === 'beauty') obj.set('visible', showBeauty);
            if (obj.groupType === 'cash') obj.set('visible', showCash);
        });
        canvas.renderAll();
    }

    function handleUpload(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
            fabric.Image.fromURL(event.target.result, function(img) {
                img.set({ left: 540, top: 540, originX: 'center', originY: 'center' });
                if (img.width > 800) img.scaleToWidth(800);
                canvas.add(img);
                canvas.setActiveObject(img);
            });
        };
        reader.readAsDataURL(e.target.files[0]);
        e.target.value = '';
    }

    function shareToIG() {
        canvas.discardActiveObject();
        canvas.renderAll();
        const dataURL = canvas.toDataURL({ format: 'png', quality: 1 });
        const link = document.createElement('a');
        link.download = 'ootd.png';
        link.href = dataURL;
        link.click();
    }
</script>

</body>
</html>
